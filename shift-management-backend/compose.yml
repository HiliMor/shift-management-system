services:
  postgres:
    image: postgres:16
    container_name: shift-management-postgres
    environment:
      POSTGRES_DB: shift_management
      POSTGRES_USER: shift_user
      POSTGRES_PASSWORD: shift_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  artemis:
    image: apache/activemq-artemis:2.37.0
    container_name: shift-management-artemis
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"
      - "8161:8161"

volumes:
  postgres_data:
