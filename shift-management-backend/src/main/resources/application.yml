spring:
  application:
    name: shift-management-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/shift_management
    username: shift_user
    password: shift_password

  artemis:
    mode: native
    broker-url: tcp://localhost:61616
    user: artemis
    password: artemis

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  seed:
    enabled: true
  jwt:
    secret: "development-secret-key-change-before-production-123456789"
    expiration: 1h
  messaging:
    notifications:
      queue: notification.events
    outbox-dispatch:
      enabled: true
      fixed-delay-ms: 5000

server:
  port: 8080
