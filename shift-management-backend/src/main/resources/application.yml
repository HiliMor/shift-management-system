spring:
  application:
    name: shift-management-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/shift_management
    username: shift_user
    password: shift_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  seed:
    enabled: true

server:
  port: 8080
